<style>
  :root {
    --bg: #faf8f5;
    --text: #1a1a1a;
    --muted: #767676;
    --accent: #b8860b;
    --hero-bg: #14141a;
    --card-bg: #ffffff;
    --border: #e8e5df;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", "Segoe UI", Roboto, sans-serif;
    line-height: 1.75;
    font-size: 1em;
  }

  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 0 1.25em 4em;
  }

  section {
    margin-bottom: 2em;
  }

  h1, h2, h3 {
    font-family: "Noto Serif TC", "Songti TC", Georgia, serif;
    font-weight: 700;
    line-height: 1.3;
  }

  h1 {
    font-size: 2.2em;
    margin: 0 0 0.3em;
  }

  h2 {
    font-size: 1.4em;
    margin: 0 0 1em;
    display: inline-block;
    position: relative;
    padding-bottom: 0.3em;
    border: none;
  }

  h2::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: 0;
    width: 2.5em;
    height: 3px;
    background: var(--accent);
  }

  h3 {
    font-size: 1.25em;
  }

  p, ul, ol {
    margin-top: 0;
    margin-bottom: 0.5em;
  }

  a, a:visited {
    color: var(--accent);
    text-decoration: none;
    font-weight: 500;
  }

  a:hover {
    opacity: 70%;
  }

  img {
    max-width: 100%;
  }

  /* Nav */
  .site-nav {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1em;
    padding: 0.9em 1.25em;
    background: rgba(250, 248, 245, 0.9);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--border);
  }

  .site-nav .brand {
    display: flex;
    align-items: center;
    gap: 0.6em;
    font-family: "Noto Serif TC", "Songti TC", Georgia, serif;
    font-weight: 700;
    font-size: 1.1em;
    color: var(--text);
  }

  .site-nav .brand img {
    width: 1.8em;
    height: 1.8em;
    border-radius: 0.4em;
    object-fit: cover;
  }

  .nav-subscribe {
    display: flex;
    gap: 0.5em;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 1.3em;
    flex-wrap: wrap;
  }

  .nav-links a {
    color: var(--text);
    font-weight: 500;
    font-size: 0.95em;
  }

  .nav-links a:hover {
    color: var(--accent);
    opacity: 1;
  }

  .nav-toggle-checkbox,
  .nav-toggle-btn {
    display: none;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 0.4em;
    padding: 0.35em 0.9em;
    border: 1px solid var(--border);
    border-radius: 999px;
    font-size: 0.85em;
    color: var(--text);
    font-weight: 500;
  }

  .pill:hover {
    border-color: var(--accent);
    color: var(--accent);
    opacity: 1;
  }

  .pill img {
    width: 1em;
    height: 1em;
    border-radius: 0.2em;
  }

  /* Hero */
  .hero {
    background-color: var(--hero-bg);
    background-size: cover;
    background-position: center;
    color: #fff;
    text-align: center;
    padding: 5em 1.25em 4em;
    margin: 0 0 3em;
  }

  .hero h1 {
    color: #fff;
    font-size: 2.6em;
  }

  .hero .description {
    max-width: 42em;
    margin: 0 auto 1.6em;
    color: #cfcfcf;
  }

  .hero .subscribe-links {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.6em;
  }

  .hero .pill {
    border-color: rgba(255, 255, 255, 0.25);
    color: #fff;
  }

  .hero .pill:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* Items */
  .item-card {
    display: flex;
    gap: 1em;
    align-items: flex-start;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 0.9em;
    padding: 1.1em 1.3em;
    margin-bottom: 1em;
    transition: box-shadow 0.15s ease, transform 0.15s ease;
    color: var(--text);
  }

  .item-card:hover {
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
    transform: translateY(-2px);
    opacity: 1;
  }

  .item-card img {
    width: 4.5em;
    height: 4.5em;
    border-radius: 0.6em;
    object-fit: cover;
    flex: none;
  }

  .item-title {
    font-weight: 700;
    font-size: 1.05em;
    color: var(--text);
    display: block;
    margin-bottom: 0.3em;
  }

  .item-meta {
    font-size: 0.85em;
    color: var(--muted);
  }

  .media-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 0.9em;
    padding: 1.2em;
    margin-bottom: 1.5em;
  }

  /* Some css classes */
  .flex {
    display: flex;
  }

  .flex-none {
    flex: none;
  }

  .flex-1 {
    flex: 1;
  }

  .items-center {
    align-items: center;
  }

  .justify-center {
    justify-content: center;
  }

  .flex-wrap {
    flex-wrap: wrap;
  }

  .px-2 {
    padding-left: 0.5em;
    padding-right: 0.5em;
  }

  .mb-1 {
    margin-bottom: 0.25em;
  }

  .mb-2 {
    margin-bottom: 0.5em;
  }

  .mb-4 {
    margin-bottom: 1em;
  }

  .mt-2 {
    margin-top: 0.5em;
  }

  .mt-4 {
    margin-top: 1em;
  }

  .ml-1 {
    margin-left: 0.25em;
  }

  .mr-4 {
    margin-right: 1em;
  }

  .one-line {
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 1;
    -webkit-box-orient: vertical;
  }

  .text-sm {
    font-size: 0.8em;
  }

  .text-lg {
    font-size: 1.25em;
  }

  .img-lg {
    max-width: 7.5em;
    border-radius: 0.8em;
    box-shadow: 0.2em 0.2em 0.2em #DCDCDC;
  }

  .img-md {
    max-width: 3.5em;
    border-radius: 0.2em;
    box-shadow: 0.1em 0.1em 0.1em #DCDCDC;
  }

  .img-sm {
    max-width: 1em;
    border-radius: 0.2em;
  }

  .border-t {
    border-top: 1px solid var(--border);
  }

  .border-b {
    border-bottom: 1px solid var(--border);
  }

  .text-center {
    text-align: center;
  }

  .w-full {
    width: 100%;
  }

  .font-bold {
    font-weight: bold;
  }

  @media only screen and (max-width: 600px) {
    .hide-mobile {
      display: none;
    }

    .hero {
      padding: 3.5em 1em 3em;
    }

    .hero h1 {
      font-size: 1.8em;
    }
  }

  .icon-arrow-left:before {
    content: "←";
  }

  .icon-arrow-right:before {
    content: "→";
  }
</style>

<!-- Lazy load images -->
<style>
  @keyframes backgroundColorPalette {
    0% {
      background: #DCDCDC;
    }
    25% {
      background: #D3D3D3;
    }
    50% {
      background: #778899;
    }
    75% {
      background: #D3D3D3;
    }
    100% {
      background: #DCDCDC;
    }
  }

  .loader {
    width: 100%;
    height: 20em;
    background-color: #DCDCDC;
    animation-name: backgroundColorPalette;
    animation-duration: 10s;
    animation-iteration-count: infinite;
    animation-direction: alternate;
  }
</style>
<script>
  document.addEventListener('DOMContentLoaded', function () {

    let lazyImageObserver = new IntersectionObserver(function (entries, observer) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          let lazyImage = entry.target;
          const newImage = document.createElement('img');
          newImage.src = lazyImage.dataset.src;
          newImage.onload = function () {
            lazyImage.classList.remove("loader");
            const wrapper = document.createElement('a');
            wrapper.setAttribute('href', newImage.src);
            wrapper.setAttribute('target', "_blank");
            wrapper.appendChild(newImage.cloneNode(true));
            if (lazyImage.parentElement) {
              lazyImage.parentElement.replaceChild(wrapper, lazyImage);
              lazyImage.remove();
            }
          };
          lazyImageObserver.unobserve(lazyImage);
        }
      });
    });

    const images = document.querySelectorAll('img:not([loading=lazy])');
    for (let i = 0; i < images.length; i++) {
      images[i].dataset.src = images[i].src;
      images[i].classList.add('loader');
      images[i].src = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP88eNnPQAJQwNqJHSUZQAAAABJRU5ErkJggg==";
      lazyImageObserver.observe(images[i]);
    }

  }, false);

</script>
